<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя</title>
    <script src="scripts/comments.js"></script>
    <script src="scripts/page-stats.js"></script>
    <link rel="stylesheet" href="css/comments.css">
</head>

<body>
    <header>
        <div class="header__top">
            <img src="images/icon.png" class="header__top-logo" alt="Логотип">
            <h1>BadgeShop</h1>
        </div>
        <nav>
            <a href="index.html" class="header__nav-item">Каталог</a>
            <a href="comments.html" class="header__nav-item">Комментарии</a>   
            <a href="prof.html" class="header__nav-item">Профиль</a>
        </nav>
    </header>

    <main>
        <form id="comment-form" class="comment-form">
            <div class="comment-form__input-group">
                <label class="form__label" for="text">Ваш комментарий:</label>
                <textarea class="form__textarea" id="text" name="text" rows="4" required></textarea>
            </div>

            <div class="comment-form__input-group">
                <label class="form__label" for="category">Категория:</label>
                <select class="form__select" id="category" name="category" required>
                    <option value="Общие">Общие</option>
                    <option value="Отзыв">Отзыв</option>
                    <option value="Вопрос">Вопрос</option>
                </select>
            </div>

            <button type="submit" id="save-data" class="form__button">Отправить</button>
        </form>

        <div id="comments-container" class="comments-container">
            <h2>Комментарии</h2>
        </div>
    </main>

    <footer>
        <p>BadgeShop 2024 Костыгов Андрей</p>
        <p>Магазин значков</p>
        <p class="load_time"></p>
    </footer>
</body>

</html>
